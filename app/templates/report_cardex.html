
{% extends "base.html" %}

{% block content %}
    <h3>Cardex Report</h3>
    <h4> Resident Name: {{ resident_initials }} </h4>
    <h5> Period: {{ start_date }} <> {{ end_date }}</h5>
    <hr>
    <table class="table table-striped">
        <thead>
            <tr>
                
                <th>Date/Time</th>
                <th>Kardex Text</th>
                <th>Staff Initials</th>
            </tr>
        </thead>
        <tbody>
            {% for row in data %}
                <tr>
                    
                    <td>{{ row[1] }}</td>
                    <td>{{ row[2] }}</td>
                    <td>{{ row[3] }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
    <a href="{{ url_for('carer.carer_menu', unit_name=unit_name, resident_initials=resident_initials) }}" class="btn-dark-green">Back to Menu</a>
{% endblock %}
